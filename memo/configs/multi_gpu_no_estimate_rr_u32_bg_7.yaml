resolution: 512
num_generated_frames_per_clip: 16
fps: 30
num_init_past_frames: 16
num_past_frames: 16
inference_steps: 20
cfg_scale: 3.5
weight_dtype: bf16
enable_xformers_memory_efficient_attention: true

model_name_or_path: memoavatar/memo
# model_name_or_path: checkpoints
vae: stabilityai/sd-vae-ft-mse
wav2vec: facebook/wav2vec2-base-960h
emotion2vec: iic/emotion2vec_plus_large
misc_model_dir: checkpoints

########## BG Cache params ###########
bg_cache_kwargs:
  bg_cache_interval: 3
  use_masked_attention: False
  masked_layers:
    spatial: ['upblock_3_layer_2']
    audio: ['upblock_3_layer_2']
    temporal: []
  remove_ref_list: ['upblock_3_layer_2']

########### DeepCache params ###########
deepcache_kwargs: 
  cache_interval: 3
  cache_layer_id: 0
  cache_block_id: -1
  uniform: True
  interval_seq: [0, 1, 2, 3, 7, 14, 18]

parallel_unet_kwargs:
  gpu_ids: [0, 1, 2]
  max_parallel_per_gpu: 3
  estimate_input_latents: False

# ########### save params ###########
