bg_cache_kwargs:
  bg_cache_interval: 1
  use_masked_attention: False
  masked_layers:
    spatial: []
    audio: []
    temporal: []
  remove_ref_list: [
                    # 'downblock_0_layer_0',
                    # 'downblock_0_layer_1',
                    # 'downblock_1_layer_0',
                    # 'downblock_1_layer_1',
                    # 'upblock_3_layer_2'
                    ]

########### DeepCache params ###########
deepcache_kwargs: 
  cache_interval: 3
  cache_layer_id: 0
  cache_block_id: -1
  uniform: true
  interval_seq: [0, 3, 6, 9, 12, 15, 18, 21, 33, 36, 39]

# deepcache_kwargs: 
